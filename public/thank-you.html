<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - NN Europe Consultant</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0f1d;
        color: white;
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        width: min(92vw, 680px);
        padding: 48px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      p {
        color: rgba(255, 255, 255, 0.68);
        line-height: 1.7;
        margin: 0 0 32px;
      }
      a {
        display: inline-flex;
        padding: 16px 28px;
        border-radius: 999px;
        color: #0a0f1d;
        background: linear-gradient(90deg, #d4af37, #f9e29c, #d4af37);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.png" alt="NN Europe Consultant logo" />
      <h1>Thank you</h1>
      <p>
        Your client form has been submitted. NN Europe Consultant will review the details and contact you using your email or WhatsApp number.
      </p>
      <a href="/">Back to website</a>
    </main>
  </body>
</html>
